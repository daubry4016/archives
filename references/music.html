function showMusic(musicId) {

    const item = music[musicId];

    document.getElementById("catalog").style.display = "none";
    document.querySelector("header").style.display = "none";
    document.querySelector(".archive-return").style.display = "none";

    document.getElementById("details").style.display = "block";

    setTimeout(function() {
        document.getElementById("details").classList.add("visible");
    }, 20);

    document.getElementById("name").textContent = item.name;
    document.getElementById("field").textContent = item.field;
    document.getElementById("description").textContent = item.description;
    document.getElementById("related").textContent = item.related;


    const works = document.getElementById("works");

    works.innerHTML = "";

    item.works.forEach(function(work) {

        const element = document.createElement("div");

        element.className = "work";
        element.textContent = work;

        works.appendChild(element);

    });


    const themes = document.getElementById("themes");

    themes.innerHTML = "";

    item.themes.forEach(function(theme) {

        const element = document.createElement("div");

        element.className = "theme";
        element.textContent = theme;

        themes.appendChild(element);

    });


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


function returnToMusic() {

    document.getElementById("details").classList.remove("visible");

    setTimeout(function() {

        document.getElementById("details").style.display = "none";
        document.getElementById("catalog").style.display = "block";
        document.querySelector("header").style.display = "block";
        document.querySelector(".archive-return").style.display = "block";

    }, 300);

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

</script>
