function showArtist(artistId) {

    const artist = artists[artistId];

    document.getElementById("catalog").style.display = "none";
    document.querySelector("header").style.display = "none";
    document.querySelector(".archive-return").style.display = "none";

    document.getElementById("details").style.display = "block";

    setTimeout(function() {
        document.getElementById("details").classList.add("visible");
    }, 20);

    document.getElementById("name").textContent = artist.name;
    document.getElementById("field").textContent = artist.field;
    document.getElementById("description").textContent = artist.description;
    document.getElementById("related").textContent = artist.related;

    const works = document.getElementById("works");

    works.innerHTML = "";

    artist.works.forEach(function(work) {

        const item = document.createElement("div");

        item.className = "work";
        item.textContent = work;

        works.appendChild(item);

    });


    const themes = document.getElementById("themes");

    themes.innerHTML = "";

    artist.themes.forEach(function(theme) {

        const tag = document.createElement("div");

        tag.className = "theme";
        tag.textContent = theme;

        themes.appendChild(tag);

    });


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


function returnToArtists() {

    document.getElementById("details").classList.remove("visible");

    setTimeout(function() {

        document.getElementById("details").style.display = "none";
        document.getElementById("catalog").style.display = "block";
        document.querySelector("header").style.display = "block";
        document.querySelector(".archive-return").style.display = "block";

    }, 300);

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

</script>
