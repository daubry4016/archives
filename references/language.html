```

</div>

<script>

const languages = {

    "latin": {
        name: "LATIN",
        origin: "ancient language · Rome · philosophy · theology",
        description: "A classical language preserved through literature, philosophy, theology, law and inscriptions. Latin remained influential long after the Roman world and became deeply connected with European intellectual traditions.",
        phrases: [
            ["carpe diem", "seize the day"],
            ["memento mori", "remember that you must die"],
            ["amor fati", "love of fate"]
        ],
        themes: ["philosophy", "theology", "classical literature", "inscriptions", "history"],
        related: "Latin connects the archive to Roman thought, medieval theology and later philosophical traditions. Its continued presence also gives old ideas a language that survives across centuries."
    },

    "french": {
        name: "FRENCH",
        origin: "language of poetry · literature · philosophy",
        description: "A language deeply associated with European literature, poetry and philosophical writing. French has carried traditions of symbolism, existential thought, aesthetics and literary experimentation.",
        phrases: [
            ["c'est la vie", "that's life"],
            ["à jamais", "forever"],
            ["l'esprit", "the spirit · the mind"]
        ],
        themes: ["poetry", "literature", "philosophy", "elegance", "symbolism"],
        related: "French connects naturally to Baudelaire, Camus and traditions of poetry and philosophy concerned with beauty, modernity, existence and the inner life."
    },

    "italian": {
        name: "ITALIAN",
        origin: "Dante · Renaissance · poetry · literary tradition",
        description: "A language strongly associated with Dante and the development of Italian literary culture. Its presence in the archive evokes medieval poetry, the Renaissance and the long relationship between language and artistic expression.",
        phrases: [
            ["nel mezzo del cammin", "in the middle of the journey"],
            ["dolce stil novo", "sweet new style"]
        ],
        themes: ["Dante", "poetry", "Renaissance", "literature", "love"],
        related: "Italian is closely connected to Dante Alighieri and the literary tradition surrounding the Dolce Stil Novo, where language, love and philosophical reflection become intertwined."
    },

    "greek": {
        name: "ANCIENT GREEK",
        origin: "classical language · philosophy · mythology",
        description: "A classical language central to ancient Greek philosophy, mythology, drama and literature. Many concepts that shaped later philosophical traditions were first expressed through Greek words and texts.",
        phrases: [
            ["γνῶθι σεαυτόν", "know thyself"],
            ["πάντα ῥεῖ", "everything flows"]
        ],
        themes: ["philosophy", "mythology", "wisdom", "classical literature", "knowledge"],
        related: "Ancient Greek connects the archive to Plato, Aristotle, Greek mythology and the philosophical tradition of questioning knowledge, reality and the nature of existence."
    }

};


function showLanguage(languageId) {

    const language = languages[languageId];

    document.getElementById("catalog").style.display = "none";
    document.querySelector("header").style.display = "none";
    document.querySelector(".archive-return").style.display = "none";

    document.getElementById("details").style.display = "block";

    setTimeout(function() {
        document.getElementById("details").classList.add("visible");
    }, 20);

    document.getElementById("name").textContent = language.name;
    document.getElementById("origin").textContent = language.origin;
    document.getElementById("description").textContent = language.description;
    document.getElementById("related").textContent = language.related;


    const phrases = document.getElementById("phrases");

    phrases.innerHTML = "";

    language.phrases.forEach(function(item) {

        const phrase = document.createElement("div");

        phrase.className = "phrase";
        phrase.textContent = item[0];

        const translation = document.createElement("div");

        translation.className = "translation";
        translation.textContent = item[1];

        phrase.appendChild(translation);
        phrases.appendChild(phrase);

    });


    const themes = document.getElementById("themes");

    themes.innerHTML = "";

    language.themes.forEach(function(theme) {

        const tag = document.createElement("div");

        tag.className = "theme";
        tag.textContent = theme;

        themes.appendChild(tag);

    });


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


function returnToLanguages() {

    document.getElementById("details").classList.remove("visible");

    setTimeout(function() {

        document.getElementById("details").style.display = "none";
        document.getElementById("catalog").style.display = "block";
        document.querySelector("header").style.display = "block";
        document.querySelector(".archive-return").style.display = "block";

    }, 300);

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

</script>

</body>
</html>
