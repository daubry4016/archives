function showPhilosophy(philosophyId) {

    const philosophy = philosophies[philosophyId];

    document.getElementById("catalog").style.display = "none";
    document.querySelector("header").style.display = "none";
    document.querySelector(".archive-return").style.display = "none";

    document.getElementById("details").style.display = "block";

    setTimeout(function() {
        document.getElementById("details").classList.add("visible");
    }, 20);

    document.getElementById("name").textContent = philosophy.name;
    document.getElementById("classification").textContent = philosophy.classification;
    document.getElementById("description").textContent = philosophy.description;
    document.getElementById("connections").textContent = philosophy.connections;


    const ideas = document.getElementById("ideas");

    ideas.innerHTML = "";

    philosophy.ideas.forEach(function(idea) {

        const element = document.createElement("div");

        element.className = "idea";
        element.textContent = idea;

        ideas.appendChild(element);

    });


    const thinkers = document.getElementById("thinkers");

    thinkers.innerHTML = "";

    philosophy.thinkers.forEach(function(thinker) {

        const element = document.createElement("div");

        element.className = "thinker";
        element.textContent = thinker;

        thinkers.appendChild(element);

    });


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


function returnToPhilosophies() {

    document.getElementById("details").classList.remove("visible");

    setTimeout(function() {

        document.getElementById("details").style.display = "none";
        document.getElementById("catalog").style.display = "block";
        document.querySelector("header").style.display = "block";
        document.querySelector(".archive-return").style.display = "block";

    }, 300);

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

</script>
