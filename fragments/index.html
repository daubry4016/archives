<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fragments — Asteren D'Aubray</title>
<style>
        body {
            background: #0b0b0b;
            color: #e8e8e8;
            font-family: Georgia, serif;
            text-align: center;
            padding: 100px 20px;
        }

        h1 {
            font-size: 32px;
            font-weight: normal;
            letter-spacing: 6px;
            text-transform: lowercase;
        }

        p {
            color: #a8a8a8;
        }

        hr {
            border: 0;
            border-top: 1px solid #333;
            max-width: 500px;
            margin: 50px auto;
        }

        #fragment {
            max-width: 600px;
            margin: 0 auto 40px;
            font-size: 20px;
            line-height: 1.8;
            font-style: italic;
            white-space: pre-line;
        }

        button {
            background: transparent;
            color: #aaa;
            border: 1px solid #444;
            padding: 10px 20px;
            font-family: Georgia, serif;
            cursor: pointer;
        }

        button:hover {
            color: white;
            border-color: #888;
        }
    </style>
</head>>

<body>

    <h1>fragments</h1>

    <p>an archive of scattered thoughts.</p>

    <hr>

    <div id="fragment">carne velata, verbum vetus in medullis resonat.</div>

    <p id="counter">fragment 01 / 03</p>

    <button onclick="anotherFragment()">another fragment</button>

    <script>
        const fragments = [
    "carne velata, verbum vetus in medullis resonat.",
    "Some thoughts are easier to preserve than to explain.",
    "Condamnee au sol monstrueux qu'est de t'aimer,\nje cultive des fleurs en terre d'epines,\nfaisant de la ruine mon art,\net de ton absence, mes chemins."
];

        function anotherFragment() {
            const random = Math.floor(Math.random() * fragments.length);
            document.getElementById("fragment").textContent = fragments[random];

            const number = String(random + 1).padStart(2, "0");
            document.getElementById("counter").textContent = "fragment" + number + " / 03";
        }
    </script>

</body>
</html>
