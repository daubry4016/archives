<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Archive — Asteren D'Aubray</title>

    <style>
        body {
            background: #0b0b0b;
            color: #d6d1c8;
            font-family: Georgia, serif;
            text-align: center;
            margin: 0;
            padding: 100px 20px;
        }

        h1 {
            font-size: 42px;
            font-weight: normal;
            letter-spacing: 6px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-style: italic;
            opacity: 0.6;
            margin-bottom: 70px;
        }

        .archive {
            max-width: 500px;
            margin: auto;
        }

        .entry {
            display: block;
            color: #d6d1c8;
            text-decoration: none;
            padding: 18px;
            margin: 12px 0;
            border-bottom: 1px solid #292929;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .entry:hover {
            opacity: 0.5;
            letter-spacing: 4px;
        }

        .number {
            opacity: 0.4;
            margin-right: 12px;
        }
    </style>
</head>

<body>

    <h1>THE ARCHIVE</h1>

    <div class="subtitle">
        fragments of what was left behind.
    </div>

    <div class="archive">

        <a class="entry" href="fragments/">
            <span class="number">I.</span>
            FRAGMENTS
        </a>

        <a class="entry" href="references/">
            <span class="number">II.</span>
            REFERENCES
        </a>

        <a class="entry" href="notes/">
            <span class="number">III.</span>
            NOTES
        </a>

        <a class="entry" href="unfinished/">
            <span class="number">IV.</span>
            UNFINISHED
        </a>

    </div>

</body>
</html>
